<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Base de Datos en la Web</title>
    <!-- Importamos una fuente moderna (Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            color: #334155;
            margin: 0;
            padding: 40px 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        h1 {
            font-size: 24px;
            font-weight: 600;
            color: #0f172a;
            margin-top: 0;
            margin-bottom: 20px;
        }
        .table-container {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }
        th, td {
            padding: 12px 16px;
            border-bottom: 1px solid #e2e8f0;
        }
        th {
            background-color: #f1f5f9;
            font-weight: 600;
            color: #475569;
            font-size: 14px;
        }
        td {
            font-size: 14px;
            color: #64748b;
        }
        tr:hover {
            background-color: #f8fafc;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>📊 Mis Datos desde Excel</h1>
        <div class="table-container">
            <table id="miTabla">
                <thead>
                    <tr id="encabezados"></tr>
                </thead>
                <tbody id="cuerpoTabla"></tbody>
            </table>
        </div>
    </div>

    <script>
        // Tu URL de Google Apps Script
        const url = 'https://script.googleusercontent.com/macros/echo?user_content_key=AUkAhnSCCB-2DRQja2--29g0aEAMtyd_GRrKgI44fJ08VuKWpHOvlHFTLZaslGJH1IyPw3eA3ERCUzlnIHqksJkQ4ETG08SyjEVQZ-jJokWlrszrMwW8S-kNTrqdWRaGQh6MoQpzHKphABCXEgMruQXmB5SPlpBazd8ME_TOo6yb4zEvQen3eMvT_llajILap1O3hzehVFhLnLjfZrmdHGsQxFtbsm4Nb-ZJixMslBcKbVI3KDrsEd7lEmGe4o3ol5vNekCAGez2_5wgKMIwX2ezL1nendgTdw&lib=M76XVruyECD8O4_VBmiJbgCFMTfYZgARb';

        fetch(url)
            .then(res => res.json())
            .then(data => {
                if (data.length > 0) {
                    // Crear encabezados
                    const keys = Object.keys(data[0]);
                    const trHead = document.getElementById('encabezados');
                    keys.forEach(key => trHead.innerHTML += `<th>${key}</th>`);

                    // Crear filas
                    const tbody = document.getElementById('cuerpoTabla');
                    data.forEach(item => {
                        let fila = '<tr>';
                        keys.forEach(key => fila += `<td>${item[key]}</td>`);
                        fila += '</tr>';
                        tbody.innerHTML += fila;
                    });
                }
            })
            .catch(error => console.error('Error al cargar los datos:', error));
    </script>
</body>
</html>
